name: Android APK

on:
  push:
    branches:
      - arena/d0df6241-mlbb-helper-2-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Validate offline hero data
        run: python3 tools/validate_data.py

      - name: Restore packages
        run: dotnet restore MlbbHelper.csproj

      - name: Build and sign APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/mlbb-helper.keystore" \
            -storetype JKS \
            -storepass mlbbhelper \
            -keypass mlbbhelper \
            -alias mlbbhelper \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MLBB Helper, OU=Community, O=MLBB Helper, C=RU"

          dotnet publish MlbbHelper.csproj \
            --configuration Release \
            --framework net10.0-android \
            --output "$RUNNER_TEMP/mlbb-publish" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/mlbb-helper.keystore" \
            -p:AndroidSigningKeyAlias=mlbbhelper \
            -p:AndroidSigningStorePass=mlbbhelper \
            -p:AndroidSigningKeyPass=mlbbhelper

          mkdir -p artifacts
          apk_file="$(find "$RUNNER_TEMP/mlbb-publish" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_file" ]]; then
            echo "Publish completed without producing an APK."
            find "$RUNNER_TEMP/mlbb-publish" -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$apk_file" artifacts/MLBB-helper-1.0.0.apk
          sha256sum artifacts/MLBB-helper-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MLBB-helper-Android-APK
          path: artifacts/MLBB-helper-1.0.0.apk
          if-no-files-found: error
          retention-days: 90
